name: zero-protocol

services:

  postgres:
    image: postgres:16-alpine
    container_name: experiment-governor-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zero_protocol}
      POSTGRES_USER: ${POSTGRES_USER:-zero_protocol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zero_protocol}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: experiment-governor-backend

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zero_protocol}:${POSTGRES_PASSWORD:-zero_protocol}@postgres:5432/${POSTGRES_DB:-zero_protocol}

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}

      DEFAULT_ORGANIZATION_ID: pulseboard

      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local-development-only}

      IMPORT_MAX_BYTES: ${IMPORT_MAX_BYTES:-5242880}

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]

      interval: 5s
      timeout: 5s
      retries: 10

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped



  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile

    container_name: experiment-governor-agent

    env_file:
      - path: .env
        required: false

    environment:

      BACKEND_BASE_URL: http://backend:8000

      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local-development-only}

      AGENT_POLL_INTERVAL_SECONDS: ${AGENT_POLL_INTERVAL_SECONDS:-2}

    working_dir: /app

    # Long-running worker: claims QUEUED decision runs from the backend.
    command: python worker.py

    depends_on:

      backend:
        condition: service_healthy

    restart: unless-stopped



  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: experiment-governor-frontend

    ports:
      - "${FRONTEND_PORT:-5173}:80"

    depends_on:

      backend:
        condition: service_healthy

    restart: unless-stopped



volumes:

  postgres_data:
